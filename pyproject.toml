[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isthd"
version = "0.1.0"
description = "Shared-interest spatio-temporal routing for recommendation on evolving interaction graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
isthd-train = "isthd.train:main"
isthd-evaluate = "isthd.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

